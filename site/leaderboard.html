<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>لوحة الصدارة وملفات الطلاب – قيمي</title><meta name="description" content="أعلى المتعلمين نقاطاً في المدرسة والصف والفصل، تراكمياً أو لهذا الشهر"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet"><link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="assets/core.css"><link rel="stylesheet" href="assets/qm.css"><link rel="stylesheet" href="assets/about.css"><link rel="stylesheet" href="assets/honor.css"></head><body class="pubsite">
<div id="hdr"></div>
<section class="hero3 slim"><div class="h3g"><div class="h3t"><span class="h3pill"><span class="tg" data-ico="trophy"></span>لوحة الصدارة · أفضل الطلاب</span><h1><em>أوائل</em> النقاط</h1><p class="h3p">الأعلى نقاطاً في المدرسة أو الصف أو الفصل، بالرصيد التراكمي أو برصيد هذا الشهر، وتحتها جميع الطلاب.</p><p class="h3p"><a class="btn" href="#dirsec">عرض جميع الطلاب</a></p></div></div></section>
<main class="hb-wrap" id="lb" style="padding-bottom:40px"><p class="hb-empty">جارٍ التحميل…</p></main>
<section class="hb-wrap" id="dirsec" style="padding-bottom:40px"><div class="hb-h"><div><h2>جميع الطلاب</h2><p>اختر الصف والفصل أو ابحث بالاسم، ثم افتح ملف المتعلم لترى أوسمته ونقاطه ومن منحها.</p></div></div><div id="dir"></div></section>
<div id="ftr"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="assets/config.js"></script><script src="assets/chrome.js"></script><script src="assets/qm.js"></script><script src="assets/about-icons.js"></script>
<script>
pubInit("leaderboard.html");
(async () => {
  const root = document.getElementById("lb"), $i = (id) => document.getElementById(id);
  let F; try { F = await rpc("qm_pub_filters"); } catch (e) { root.innerHTML = `<p class="hb-empty">تعذر التحميل. حدّث الصفحة بعد قليل.</p>`; return; }
  const st = { scope: "school", grade: F.grades[0]?.code || "", section: "", limit: 10, period: "all" };
  const seg = (id, opts, cur) => `<div class="hb-seg" id="${id}">${opts.map(([v, l]) => `<button type="button" data-v="${v}" aria-pressed="${String(v) === String(cur)}">${l}</button>`).join("")}</div>`;
  const title = ["الأول", "الثاني", "الثالث"];
  const draw = async () => {
    const secs = F.sections.filter((s) => s.grade === st.grade);
    if (st.scope === "section" && !secs.some((s) => s.id === st.section)) st.section = secs[0]?.id || "";
    root.innerHTML = `<div class="hb-panel hb-filters"><div><label>النطاق</label>${seg("sc", [["school", "المدرسة"], ["grade", "الصف"], ["section", "الفصل"]], st.scope)}</div><div><label>الرصيد</label>${seg("pe", [["all", "التراكمي"], ["month", "هذا الشهر"]], st.period)}</div>
      <div ${st.scope === "school" ? "hidden" : ""}><label for="gr">الصف</label><select id="gr">${F.grades.map((g) => `<option value="${esc(g.code)}">${esc(g.name)}</option>`).join("")}</select></div>
      <div ${st.scope === "section" ? "" : "hidden"}><label for="se">الفصل</label><select id="se">${secs.map((s) => `<option value="${s.id}">${esc(s.name)}</option>`).join("")}</select></div>
      <div><label>العدد</label>${seg("li", [[10, "أفضل 10"], [20, "20"], [30, "30"]], st.limit)}</div></div><div id="rs"></div>`;
    if (st.grade) $i("gr").value = st.grade; if (st.section) $i("se").value = st.section;
    const bind = (id, k, num) => $i(id).querySelectorAll("button").forEach((b) => (b.onclick = () => { st[k] = num ? +b.dataset.v : b.dataset.v; draw(); }));
    bind("sc", "scope"); bind("pe", "period"); bind("li", "limit", true);
    $i("gr").onchange = (e) => { st.grade = e.target.value; st.section = ""; draw(); };
    $i("se").onchange = (e) => { st.section = e.target.value; draw(); };
    const out = $i("rs");
    if (st.scope === "section" && !st.section) { out.innerHTML = `<p class="hb-empty">لا فصول لهذا الصف.</p>`; return; }
    try {
      const L = await rpc("qm_pub_leaderboard", { p_scope: st.scope, p_grade: st.scope === "school" ? null : st.grade, p_section: st.scope === "section" ? st.section : null, p_limit: st.limit, p_period: st.period });
      if (!L.length) { out.innerHTML = `<div class="hb-panel" style="margin-top:22px"><p class="hb-empty">${st.period === "month" ? "لم تُمنح نقاط هذا الشهر في هذا النطاق بعد." : "لا نقاط بعد في هذا النطاق."}</p></div>`; return; }
      const max = Math.max(1, ...L.map((x) => x.balance)), pod = L.slice(0, 3).map((x, k) => ({ ...x, m: k + 1 }));
      out.innerHTML = `<div class="hb-pod lite" style="${pod.length < 3 ? "grid-template-columns:repeat(" + pod.length + ",minmax(0,300px));justify-content:center" : ""}">${(pod.length === 3 ? [pod[1], pod[0], pod[2]] : pod).map((x) => `<a class="hb-pc" data-m="${x.m}" href="student.html?id=${x.id}"><span class="hb-crown">${x.m === 1 ? ico("crown") : ""}</span><span class="hb-seal" aria-hidden="true">${esc(initials(x.name))}<i>${x.rank}</i></span><b class="nm">${esc(shortName(x.name))}</b><small>المركز ${title[x.rank - 1] || x.rank}، ${klass(x)}</small><span class="v">${x.balance}<em>نقطة</em></span></a>`).join("")}</div>
        <div class="hb-panel" style="margin-top:22px"><ol class="hb-lad">${L.map((x) => `<li><a class="hb-row" data-m="${x.rank <= 3 ? x.rank : ""}" href="student.html?id=${x.id}"><span class="hb-rk">${x.rank}</span><span class="hb-nm"><b>${esc(x.name)}</b><small>${klass(x)}</small><span class="hb-bar"><i style="--w:${Math.round((x.balance / max) * 100)}%"></i></span></span><span class="hb-pv">${x.balance}<small>نقطة</small></span></a></li>`).join("")}</ol></div>
        <p class="hb-note">عند تساوي النقاط يتشارك المتعلمون المرتبة نفسها.</p>`;
    } catch (e) { out.innerHTML = `<p class="hb-empty">${esc(mapErr(e))}</p>`; }
  };
  await draw();
})();
(async () => {
  const droot = document.getElementById("dir"), $i = (id) => document.getElementById(id);
  const F = await rpc("qm_pub_filters").catch(() => null); if (!F) return;
  
  const st = { grade: "", section: "", q: "", page: 0 }, N = 48;
  droot.innerHTML = `<div class="hb-panel hb-filters"><div><label for="dsg">المرحلة</label><select id="dsg"><option>المتوسطة</option></select></div><div><label for="dgr">الصف</label><select id="dgr"><option value="">كل الصفوف</option>${F.grades.map((g) => `<option value="${esc(g.code)}">${esc(g.name)}</option>`).join("")}</select></div><div><label for="dse">الفصل</label><select id="dse"></select></div><div><label for="dq">بحث بالاسم</label><input id="dq" type="search" placeholder="اكتب جزءاً من الاسم"></div></div><div id="drs"></div>`;
  const secs = () => { $i("dse").innerHTML = `<option value="">كل الفصول</option>` + F.sections.filter((s) => st.grade && s.grade === st.grade).map((s) => `<option value="${s.id}">${esc(s.name)}</option>`).join(""); $i("dse").value = st.section; $i("dse").disabled = !st.grade; };
  const load = async () => {
    const out = $i("drs");
    try {
      const D = await rpc("qm_pub_directory", { p_grade: st.grade || null, p_section: st.section || null, p_q: st.q || null, p_limit: N, p_offset: st.page * N });
      if (!D.rows.length) { out.innerHTML = `<div class="hb-panel" style="margin-top:22px"><p class="hb-empty">لا متعلمين مطابقين. جرّب اسماً آخر أو صفاً آخر.</p></div>`; return; }
      const pages = Math.ceil(D.total / N);
      out.innerHTML = `<p class="hb-note">${D.total} متعلماً</p><div class="hb-dir">${D.rows.map((x) => `<a class="hb-st" href="student.html?id=${x.id}"><span class="hb-ini" aria-hidden="true">${esc(initials(x.name))}</span><span><b>${esc(x.name)}</b><small>${klass(x)}</small><span class="tags"><span>${ico("star")}${x.balance} نقطة</span>${x.badges ? `<span class="g">${ico("medal")}${x.badges} ${x.badges > 10 || x.badges < 3 ? "وسام" : "أوسمة"}</span>` : ""}</span></span></a>`).join("")}</div>
        ${pages > 1 ? `<div class="hb-pager"><button class="btn sec" id="dpv" ${st.page ? "" : "disabled"}>السابق</button><span class="sub">صفحة ${st.page + 1} من ${pages}</span><button class="btn sec" id="dnx" ${st.page + 1 < pages ? "" : "disabled"}>التالي</button></div>` : ""}`;
      const pv = $i("dpv"), nx = $i("dnx");
      if (pv) pv.onclick = () => { st.page--; load(); document.getElementById("dir").scrollIntoView(); };
      if (nx) nx.onclick = () => { st.page++; load(); document.getElementById("dir").scrollIntoView(); };
    } catch (e) { out.innerHTML = `<p class="hb-empty">${esc(mapErr(e))}</p>`; }
  };
  $i("dgr").onchange = (e) => { st.grade = e.target.value; st.section = ""; st.page = 0; secs(); load(); };
  $i("dse").onchange = (e) => { st.section = e.target.value; st.page = 0; load(); };
  let t; $i("dq").oninput = (e) => { clearTimeout(t); t = setTimeout(() => { st.q = e.target.value.trim(); st.page = 0; load(); }, 300); };
  secs(); load();
})();
</script></body></html>
